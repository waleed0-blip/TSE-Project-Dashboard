            let localHeadlines = localStorage.getItem('tse_headlines_data');

                    "Nova 15 Max": { cat: "Smartphones", sub: "Nova Series" },
                    "Mate 80 Pro": { cat: "Smartphones", sub: "Mate Series" },
                    "FreeBuds Pro 5": { cat: "Audio", sub: "TWS Earbuds" },
                    "Matepad Mini": { cat: "Tablets", sub: "MatePad Series" },
                    "GT Runner 2": { cat: "Wearables", sub: "Smartwatches" }
                };
                Object.keys(activeStateDataset).forEach(key => {
                    let t = activeStateDataset[key].title;
                    if (correctSubCats[t]) {
                        if (!activeStateDataset[key].category || activeStateDataset[key].category === "Other Devices") {
                            activeStateDataset[key].category = correctSubCats[t].cat;
                        }
                        if (!activeStateDataset[key].subCategory || activeStateDataset[key].subCategory === "General") {
                            activeStateDataset[key].subCategory = correctSubCats[t].sub;
                        }
                    }
                });
                commitData('checklist'); 

            } else {
                activeStateDataset = JSON.parse(JSON.stringify(DEFAULT_CHECKLIST_DATA));
            }

            if(localIncidents) incidentLogDataset = JSON.parse(localIncidents);
            else if(incidentLogDataset.length === 0) incidentLogDataset = JSON.parse(JSON.stringify(DEFAULT_INCIDENTS_DATA));

            if(localHeadlines) globalHeadlinesDataset = JSON.parse(localHeadlines);

            applyHeadlineStateToDOM();
            rebuildSummaryTableMarkupStructures();
            renderMatrixDashboardGrid();
            calculateDynamicKPIs();

            fetchCloudState().then(() => {
                applyHeadlineStateToDOM();
                rebuildSummaryTableMarkupStructures();
                renderMatrixDashboardGrid();
                calculateDynamicKPIs();
            });
        } else {
            document.getElementById('authErrorNode').style.display = 'block';
            document.getElementById('masterGateKeyInput').value = '';

    function updateProductMeta(prodId, field, value) {
        if(activeStateDataset[prodId]) {
            activeStateDataset[prodId][field] = value.trim() || "Uncategorized";
            commitData('checklist');
            refreshMetrics(); 
        }
    }
    
    function updateBulkMeta(oldCat, oldSubCat, field, newValue) {
        let val = newValue.trim();
        if(!val) return;
        
        let changed = false;
        Object.keys(activeStateDataset).forEach(id => {
            let p = activeStateDataset[id];
            if (field === 'category' && (p.category || 'Other Devices') === oldCat) {
                p.category = val;
                changed = true;
            } else if (field === 'subCategory' && (p.category || 'Other Devices') === oldCat && (p.subCategory || 'General') === oldSubCat) {
                p.subCategory = val;
                changed = true;
            }
        });
        
        if(changed) {
            commitData('checklist');
            refreshMetrics();
            showTestedProductsModal(); 
            renderMatrixDashboardGrid();
        }
    }

    function calculateDynamicKPIs() {
        let filteredIncidents = incidentLogDataset;
        let targetLabel = "Project Scope Issues";
        
        if (currentActiveFilterId !== "" && activeStateDataset[currentActiveFilterId]) {
            const modelText = activeStateDataset[currentActiveFilterId].title;
            filteredIncidents = incidentLogDataset.filter(i => i.model.toLowerCase().includes(modelText.toLowerCase()));
            targetLabel = `${modelText} Captured Issues`;
        }

        let pendingCount = 0; let solvedCount = 0;
        filteredIncidents.forEach(inc => {
            if(inc.status === "PENDING") pendingCount++; else solvedCount++;
        });

        let rawClosureRatePercent = filteredIncidents.length > 0 ? Math.round((solvedCount / filteredIncidents.length) * 100) : 0;

        document.getElementById('kpiScopeLabel').innerText = targetLabel;
        document.getElementById('kpiTotal').innerText = filteredIncidents.length;
        document.getElementById('kpiPending').innerText = pendingCount;
        document.getElementById('kpiSolved').innerText = solvedCount;
        document.getElementById('kpiClosureRate').innerText = `${rawClosureRatePercent}%`;
        
        renderIncidentLogTable(filteredIncidents);
    }

    function displayClosureChartOverlayModal() {
        let solved = incidentLogDataset.filter(i => i.status === "SOLVED").length;
        let pending = incidentLogDataset.filter(i => i.status === "PENDING").length;
        let total = incidentLogDataset.length;
        let rate = total > 0 ? Math.round((solved / total) * 100) : 0;

        document.getElementById('modalTargetTitle').innerText = "Strategic Operational Health Matrix";
        document.getElementById('modalKpiContainer').style.display = 'none';
        document.getElementById('modalTableWrapElement').style.display = 'none';
        
        const pieGauge = document.getElementById('radialClosurePieVisual');
        pieGauge.style.background = `conic-gradient(var(--success-color) ${rate}%, #e2e8f0 ${rate}%)`;
        pieGauge.title = `💡 Data Overview:\n🟢 SOLVED Issues: ${solved}\n🟡 PENDING Issues: ${pending}\n📊 Grand Total Captured: ${total}`;
        
        document.getElementById('radialClosureTextNode').innerText = `${rate}%`;
        document.getElementById('modalChartGaugeArea').style.display = 'flex';

        document.getElementById('analyticsKpiModal').style.display = 'flex';
    }

    function renderIncidentLogTable(datasetToDraw) {
        const tbody = document.getElementById('incidentTableBody');
        if (!tbody) return; tbody.innerHTML = '';

        datasetToDraw.forEach((inc) => {
            const globalIndex = incidentLogDataset.findIndex(i => i === inc);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="table-text-input" value="${inc.model}" oninput="handleIncidentTableInput(${globalIndex}, 'model', this.value)"></td>
                <td><input type="text" class="table-text-input" value="${inc.issue}" oninput="handleIncidentTableInput(${globalIndex}, 'issue', this.value)"></td>
                <td><input type="text" class="table-text-input" value="${inc.date}" oninput="handleIncidentTableInput(${globalIndex}, 'date', this.value)"></td>
                <td><input type="text" class="table-text-input" value="${inc.ref}" oninput="handleIncidentTableInput(${globalIndex}, 'ref', this.value)"></td>
                <td><input type="text" class="table-text-input" value="${inc.action}" oninput="handleIncidentTableInput(${globalIndex}, 'action', this.value)"></td>
                <td>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <select class="script-select ${inc.status === 'SOLVED' ? 'status-done' : 'status-pending'}" onchange="updateIncidentStatus(this, ${globalIndex})">
                            <option value="PENDING" ${inc.status === 'PENDING' ? 'selected' : ''}>PENDING</option>
                            <option value="SOLVED" ${inc.status === 'SOLVED' ? 'selected' : ''}>SOLVED</option>
                        </select>
                        <button class="incident-del-btn" onclick="deleteIncidentRow(${globalIndex})" title="Delete this issue log">✕</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function triggerKpiFilterModal(scopeFilterMode) {
        let targetedArray = incidentLogDataset;
        let titleLabel = "Full Project Captured Issues History";

        if (currentActiveFilterId !== "" && activeStateDataset[currentActiveFilterId]) {
            const modelText = activeStateDataset[currentActiveFilterId].title;
            targetedArray = incidentLogDataset.filter(i => i.model.toLowerCase().includes(modelText.toLowerCase()));
            titleLabel = `${modelText} Filtered Metrics Allocation`;
        }

        if (scopeFilterMode === "PENDING") { targetedArray = targetedArray.filter(i => i.status === "PENDING"); titleLabel += " - Open Pending Actions"; }
        else if (scopeFilterMode === "SOLVED") { targetedArray = targetedArray.filter(i => i.status === "SOLVED"); titleLabel += " - Resolved Track Logs"; }

        document.getElementById('modalTargetTitle').innerText = titleLabel;
        document.getElementById('modalKpiContainer').style.display = 'none';
        document.getElementById('modalChartGaugeArea').style.display = 'none';
        document.getElementById('modalTableWrapElement').style.display = 'block';

        const thead = document.getElementById('modalTableHeader');
        thead.innerHTML = `<tr><th>Product Model</th><th>Captured Technical Issue</th><th>Date Logged</th><th>Reference Code</th><th>Status</th></tr>`;

        const modalBody = document.getElementById('modalTableBodyTarget');
        modalBody.innerHTML = '';

        if(targetedArray.length === 0) {
            modalBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:30px;">No records found matching this scope.</td></tr>`;
        } else {
            targetedArray.forEach(inc => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong style="color:var(--primary-color);">${inc.model}</strong></td>
                    <td style="color:#475569;">${inc.issue}</td>
                    <td><span style="font-family:monospace; background:#f1f5f9; padding:4px 8px; border-radius:6px; font-size:0.85rem;">${inc.date}</span></td>
                    <td><span style="font-family:monospace; background:#f1f5f9; padding:4px 8px; border-radius:6px; font-size:0.85rem;">${inc.ref}</span></td>
                    <td><span class="status-badge-inline ${inc.status === 'SOLVED' ? 'status-done':'status-pending'}">${inc.status}</span></td>
                `;
                modalBody.appendChild(tr);
            });
        }
        document.getElementById('analyticsKpiModal').style.display = 'flex';
    }

        document.getElementById('modalTargetTitle').innerText = "Products Fully Tested (100% Completion)";
        document.getElementById('modalKpiContainer').style.display = 'grid';
        document.getElementById('modalChartGaugeArea').style.display = 'none';
        document.getElementById('modalTableWrapElement').style.display = 'block';

        let catCount = Object.keys(completedProductsData).length;
        let subCatCount = 0;
        let devCount = 0;

        let html = "";

        if(catCount === 0) {
            html = `<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:30px;">No products have reached 100% completion testing yet.</td></tr>`;
        } else {
            Object.keys(completedProductsData).forEach(cat => {
                let subCats = completedProductsData[cat];
                subCatCount += Object.keys(subCats).length;
                
                let totalDevicesInCat = 0;
                Object.values(subCats).forEach(arr => totalDevicesInCat += arr.length);

                let isFirstInCat = true;

                Object.keys(subCats).forEach(subCat => {
                    let devices = subCats[subCat];
                    devCount += devices.length;

                    devices.forEach((baseName, idx) => {
                        let capturedIssuesNum = incidentLogDataset.filter(i => i.model.toLowerCase() === baseName.toLowerCase()).length;

                        html += `<tr>`;
                        if(isFirstInCat) {
                            let catDisplay = editMode ? `<input type="text" class="modal-edit-input cat-font" value="${cat}" onchange="updateBulkMeta('${cat}', null, 'category', this.value)" placeholder="Edit Main Cat">` : cat;
                            html += `<td class="cat-header" rowspan="${totalDevicesInCat}">${catDisplay}</td>`;
                            isFirstInCat = false;
                        }
                        if(idx === 0) {
                            let subCatDisplay = editMode ? `<input type="text" class="modal-edit-input subcat-font" value="${subCat}" onchange="updateBulkMeta('${cat}', '${subCat}', 'subCategory', this.value)" placeholder="Edit Sub-Cat">` : subCat;
                            html += `<td class="subcat-header" rowspan="${devices.length}">${subCatDisplay}</td>`;
                        }
                        html += `<td class="cat-item">✔️ ${baseName} <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500; margin-left:6px;">(${capturedIssuesNum} Captured Issues)</span></td></tr>`;
                    });
                });
            });
        }

        const elCat = document.getElementById('modalKpiCat');
        const elSubCat = document.getElementById('modalKpiSubCat');
        const elDev = document.getElementById('modalKpiDev');
        if(elCat) elCat.innerText = catCount;
        if(elSubCat) elSubCat.innerText = subCatCount;
        if(elDev) elDev.innerText = devCount;

        const thead = document.getElementById('modalTableHeader');
        thead.innerHTML = `<tr><th>Main Category</th><th>Sub-Category</th><th>Validated Products</th></tr>`;

        const modalBody = document.getElementById('modalTableBodyTarget');
        modalBody.innerHTML = html;

        document.getElementById('analyticsKpiModal').style.display = 'flex';
    }

    function closeKpiDetailsModal() { document.getElementById('analyticsKpiModal').style.display = 'none'; }

    function addNewProductColumnChannel() {
        const rawName = prompt("Enter the name of the new Product Model (e.g. Mate 80 Pro):");
        if(!rawName) return;
        const catName = prompt("Enter Category (e.g. Smartphones, Tablets, Wearables, Audio):", "Other Devices") || "Other Devices";
        const subCatName = prompt("Enter Sub-Category (e.g. Mate Series, Nova Series, TWS Earbuds):", "General") || "General";

        const cleanKey = "prod_" + Date.now();
        
        activeStateDataset[cleanKey] = { 
            title: rawName.trim(), 
            script: "pending", 
            category: catName.trim(), 
            subCategory: subCatName.trim(),
            isArchived: false, 
            key: [], app: [], prev: [] 
        };
        
        commitData('checklist');
        rebuildSummaryTableMarkupStructures();
        renderMatrixDashboardGrid();
        calculateDynamicKPIs();
    }

    function removeProductColumnChannel(id) {
        if(!confirm(`Delete "${activeStateDataset[id].title}" permanently?`)) return;
        delete activeStateDataset[id];
        if(currentActiveFilterId === id) currentActiveFilterId = "";
        
        commitData('checklist');
        rebuildSummaryTableMarkupStructures();
        renderMatrixDashboardGrid();
        calculateDynamicKPIs();
    }

    function scrollToSectionBlock(sectionDataId) {
        if (!editMode) return; 
        const grid = document.getElementById('matrixGrid');
        if(!grid) return; grid.scrollIntoView({ behavior: 'smooth' });
        document.querySelectorAll(`.block-section[data-section="${sectionDataId}"]`).forEach(block => {
            block.style.backgroundColor = "#fffde7"; setTimeout(() => { block.style.backgroundColor = "transparent"; }, 2500);
        });
    }

    function unhideProductColumn(id) {
        activeStateDataset[id].isArchived = false;
        commitData('checklist');
        switchProductFilter(''); 
    }

    function renderMatrixDashboardGrid() {
        const grid = document.getElementById('matrixGrid');
        if (!grid) return; grid.innerHTML = '';

        Object.keys(activeStateDataset).forEach(id => {
            const prod = activeStateDataset[id];
            
            if (currentActiveFilterId === "" && prod.isArchived) return;

            const col = document.createElement('div');
            col.className = 'product-column'; col.setAttribute('data-id', id);

            let contentHTML = `
                <div class="product-column-header-wrap">
                    <button class="remove-column-btn" onclick="removeProductColumnChannel('${id}')">✕</button>
                    <input type="text" class="product-title-node product-title-input" value="${prod.title}" oninput="handleProductTitleInput('${id}', this.value)">
                    <div class="cat-meta-inputs">
                        <input type="text" class="meta-input" value="${prod.category || 'Other Devices'}" onchange="updateProductMeta('${id}', 'category', this.value)" placeholder="Category" title="Edit Main Category">
                        <input type="text" class="meta-input" value="${prod.subCategory || 'General'}" onchange="updateProductMeta('${id}', 'subCategory', this.value)" placeholder="Sub-Category" title="Edit Sub-Category">
                    </div>
                </div>
            `;

            if (prod.isArchived && currentActiveFilterId === id) {
                contentHTML += `<div class="unhide-block"><button class="btn-unhide" onclick="unhideProductColumn('${id}')">👁️ Unhide to Main Dashboard</button></div>`;
            }

            contentHTML += `
                <div class="product-content">
                    <div class="block-section" data-section="script">
                        <div class="block-header">
                            <span>Sales Product Scripts</span>
                            <select class="script-select status-${prod.script}" id="sel-${id}" onchange="updateScriptStatus(this, '${id}')">
                                <option value="pending" ${prod.script === 'pending' ? 'selected' : ''}>✕ Pending</option>
                                <option value="progress" ${prod.script === 'progress' ? 'selected' : ''}>⚠ In Progress</option>
                                <option value="done" ${prod.script === 'done' ? 'selected' : ''}>✓ Done</option>
                            </select>
                        </div>
                    </div>
            `;

            ['key', 'app', 'prev'].forEach(sec => {
                let titleLabel = sec === 'key' ? "Key Functions" : sec === 'app' ? "Common Apps" : "Previous Series Issues";
                contentHTML += `
                    <div class="block-section" data-section="${sec}">
                        <div class="block-header"><span>${titleLabel}</span></div>
                        <ul class="node-list">
                `;

                if (prod[sec] && Array.isArray(prod[sec])) {
                    prod[sec].forEach((item, index) => {
                        contentHTML += `
                            <li class="node-item">
                                <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="handleCheckboxStateToggle(this, '${id}', '${sec}', ${index})">
                                <input type="text" class="node-text-input" value="${item.text}" oninput="handleItemTextInput('${id}', '${sec}', ${index}, this.value)">
                                <button class="delete-node-btn" onclick="deleteItemElement(this, '${id}', '${sec}', ${index})">✕</button>
                            </li>
                        `;
                    });
                }

                contentHTML += `</ul><button class="add-node-btn" onclick="addNewItemElement('${id}', '${sec}')">➕ Add Item</button></div>`;
            });

            contentHTML += `</div>`; col.innerHTML = contentHTML; grid.appendChild(col);
            updateScriptStatus(col.querySelector('.script-select'), id, false);
        });
        refreshMetrics();
    }

    function checkProductAutoCompletion(prodId) {
        let pTotal = 0; let pChecked = 0;
        ['key', 'app', 'prev'].forEach(sec => {
            if(activeStateDataset[prodId][sec]) {
                pTotal += activeStateDataset[prodId][sec].length;
                pChecked += activeStateDataset[prodId][sec].filter(i => i.checked).length;
            }
        });
        
        if (pTotal > 0 && pTotal === pChecked && !activeStateDataset[prodId].isArchived) {
            setTimeout(() => {
                if(confirm(`Great job! All checks for ${activeStateDataset[prodId].title} are fully complete.\n\nDo you want to auto-hide this product from the main dashboard to keep your view clean?`)) {
                    activeStateDataset[prodId].isArchived = true;
                    commitData('checklist');
                    if(currentActiveFilterId === "") renderMatrixDashboardGrid(); 
                }
            }, 400); 
        }
    }

    function handleCheckboxStateToggle(chk, id, sec, idx) {
        activeStateDataset[id][sec][idx].checked = chk.checked;
        refreshMetrics();
        commitData('checklist');
        if(chk.checked) checkProductAutoCompletion(id);
    }

    function addNewItemElement(id, sec) {
        saveDOMChangesToArray();
        activeStateDataset[id][sec].push({ text: "New Parameter Metric...", checked: false });
        renderMatrixDashboardGrid();
        toggleLiveEditDOMSync(true);
        commitData('checklist');
    }

    function deleteItemElement(btn, id, sec, idx) {
        saveDOMChangesToArray();
        activeStateDataset[id][sec].splice(idx, 1);
        renderMatrixDashboardGrid();
        toggleLiveEditDOMSync(true);
        commitData('checklist');
    }

    function toggleLiveEditDOMSync(forceStyles = false) {
        if(editMode || forceStyles) {
            document.body.classList.add('admin-unlocked');
        } else {
            document.body.classList.remove('admin-unlocked');
        }
    }

    function saveDOMChangesToArray() {
        const mainInput = document.getElementById('globalMainHeadlineText');
        const overviewInput = document.getElementById('headlineOverviewPanelText');
        const logInput = document.getElementById('headlineIncidentLogText');
        
        if(mainInput && mainInput.value.trim() !== "") globalHeadlinesDataset.main = mainInput.value.trim();
        if(overviewInput && overviewInput.value.trim() !== "") globalHeadlinesDataset.overview = overviewInput.value.trim();
        if(logInput && logInput.value.trim() !== "") globalHeadlinesDataset.log = logInput.value.trim();
        
        document.querySelectorAll('.product-column').forEach(col => {
            const id = col.getAttribute('data-id');
            if (!activeStateDataset[id]) return;
            
            const titleNode = col.querySelector('.product-title-input');
            if(titleNode) activeStateDataset[id].title = titleNode.value.trim();
            
            ['key', 'app', 'prev'].forEach(sec => {
                const rows = col.querySelectorAll(`.block-section[data-section="${sec}"] .node-item`);
                rows.forEach((li, idx) => {
                    const textNode = li.querySelector('.node-text-input');
                    if(textNode && activeStateDataset[id][sec][idx]) {
                        activeStateDataset[id][sec][idx].text = textNode.value.trim();
                    }
                });
            });
        });
        
        commitData('headlines');
        commitData('checklist');
    }

    function toggleLiveEdit() {
        if (!editMode) {
            const inputPass = prompt("Enter Admin Password:");
            if (inputPass !== ADMIN_EDIT_PASSWORD) return;
            editMode = true;
            document.getElementById('editModeBtn').textContent = "💾 Lock Admin Layout";
        } else {
            editMode = false;
            document.getElementById('editModeBtn').textContent = "🔒 Unlock Admin Edit";
            saveDOMChangesToArray(); 
        }
        rebuildSummaryTableMarkupStructures(); 
        renderMatrixDashboardGrid();
        calculateDynamicKPIs();
        toggleLiveEditDOMSync();
    }

    function updateScriptStatus(selectElement, prodId, updateStorage = true) {
        if (!selectElement) return;
        selectElement.className = `script-select status-${selectElement.value}`;
        const tableBadge = document.getElementById(`m-script-${prodId}`);
        if(tableBadge) { 
            tableBadge.className = `status-badge-inline status-${selectElement.value}`; 
            tableBadge.innerText = selectElement.value === 'done' ? '✓ DONE' : selectElement.value.toUpperCase(); 
        }
        if(updateStorage) { 
            activeStateDataset[prodId].script = selectElement.value; 
            commitData('checklist'); 
        }
    }

    function refreshMetrics() {
        completedProductsData = {}; 
        let uniqueTestedBaseNames = new Set();

        Object.keys(activeStateDataset).forEach(prodId => {
            let pTotal = 0; let pChecked = 0;
            
            ['key', 'app', 'prev'].forEach(sec => {
                if (activeStateDataset[prodId] && activeStateDataset[prodId][sec]) {
                    const total = activeStateDataset[prodId][sec].length;
                    const checked = activeStateDataset[prodId][sec].filter(i => i.checked).length;
                    pTotal += total; pChecked += checked;
                    
                    let badge = document.getElementById(`badge-${sec}-${prodId}`);
                    if (badge) {
                        if (total > 0 && checked === total) {
                            badge.className = "status-badge-inline status-done";
                            badge.innerText = "✓ DONE";
                        } else {
                            badge.className = "status-badge-inline status-pending";
                            badge.innerText = "PENDING";
                        }
                    }
                }
            });

            if (pTotal > 0 && pTotal === pChecked) {
                let baseName = activeStateDataset[prodId].title;
                let cat = activeStateDataset[prodId].category || "Other Devices";
                let subCat = activeStateDataset[prodId].subCategory || "General";
                
                if(!completedProductsData[cat]) completedProductsData[cat] = {};
                if(!completedProductsData[cat][subCat]) completedProductsData[cat][subCat] = [];
                
                if(!completedProductsData[cat][subCat].includes(baseName)) {
                    completedProductsData[cat][subCat].push(baseName);
                }
                
                uniqueTestedBaseNames.add(baseName);
            }
        });

        document.getElementById('kpiTested').innerText = uniqueTestedBaseNames.size;
    }

    function switchProductFilter(id) {
        currentActiveFilterId = id;
        document.querySelectorAll('#filterTabGroup .tab-btn').forEach(btn => btn.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');

        renderMatrixDashboardGrid(); 
        calculateDynamicKPIs();
    }

    function executeSearch() {
        const query = document.getElementById('dashboardSearch').value.trim().toLowerCase();
        document.querySelectorAll('.node-item').forEach(item => {
            if(item.querySelector('.node-text-input').value.toLowerCase().includes(query) || !query) item.style.opacity = "1"; else item.style.opacity = "0.2";
        });
    }

    function securedDownloadRouter() {
        const inputCheck = prompt("Enter Admin Verification Code to download:");
        if (inputCheck !== ADMIN_EDIT_PASSWORD) { alert("Access Denied."); return; }
        const format = document.getElementById('exportFormat').value;
        if (format === 'pdf') { window.print(); } 
        else if (format === 'excel') { exportToCSVFile(); }
        else if (format === 'ppt') { generateComprehensivePresentationDeck(); }
    }

    async function fetchCloudState() {
        if(CLOUD_DATABASE_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") return;
        try {
            let res = await fetch(CLOUD_DATABASE_URL);
            let json = await res.json();
            if(json.status === "success" && json.data) {
                if(json.data.checklist && Object.keys(json.data.checklist).length > 0) {
                    activeStateDataset = json.data.checklist;
                    localStorage.setItem('tse_checklist_data', JSON.stringify(activeStateDataset));
                }
                if(json.data.incidents && json.data.incidents.length > 0) {
                    incidentLogDataset = json.data.incidents;
                    localStorage.setItem('tse_incidents_data', JSON.stringify(incidentLogDataset));
                }
                if(json.data.headlines && json.data.headlines.main) {
                    globalHeadlinesDataset = json.data.headlines;
                    localStorage.setItem('tse_headlines_data', JSON.stringify(globalHeadlinesDataset));
                }
            }
        } catch(e) { console.log("Cloud Read Error:", e); }
    }

    async function syncCloudChannel(type, payloadData) {
        if(CLOUD_DATABASE_URL === "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE") return;
        try {
            await fetch(CLOUD_DATABASE_URL, {
                method: "POST", headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ dataType: type, payload: payloadData })
            });
        } catch(e) { console.log("Cloud Push Error:", e); }
    }

    function createNewIncidentRow() {
        incidentLogDataset.unshift({ model: "New Product", issue: "Describe issue...", date: "2026-06", ref: "Ref ID", action: "HQ action...", status: "PENDING" });
        calculateDynamicKPIs(); 
        commitData('incidents');
    }

    function updateIncidentStatus(select, globalIdx) {
        incidentLogDataset[globalIdx].status = select.value;
        calculateDynamicKPIs(); 
        commitData('incidents');
    }

    function deleteIncidentRow(globalIdx) {
        if(!confirm("Are you sure you want to permanently delete this issue log?")) return;
        incidentLogDataset.splice(globalIdx, 1);
        calculateDynamicKPIs();
        commitData('incidents');
    }

    function exportToCSVFile() {
        let csv = "Category,Product,Requirement/Item,Status\n";
        incidentLogDataset.forEach(i => { csv += `"Incident Log","${i.model}","${i.issue.replace(/"/g, '""')}","${i.status}"\n`; });
        triggerNativeDownload(encodeURI("data:text/csv;charset=utf-8," + csv), "Project_Analytics_Log.csv");
    }

    function generateComprehensivePresentationDeck() {
        let pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_16x9';
        let slide1 = pptx.addSlide(); slide1.addShape(pptx.ShapeType.rect, { fill: '0f172a', x: 0, y: 0, w: '100%', h: '100%' });
        slide1.addText(`${globalHeadlinesDataset.main.toUpperCase()}`, { x: 0.6, y: 2.2, w: 11, h: 2, fontSize: 26, bold: true, color: 'ffffff' });
        
        let slide2 = pptx.addSlide(); slide2.addText("ANALYTICS PERFORMANCE SUMMARY TIMELINE", { x: 0.5, y: 0.4, w: 10, h: 0.5, fontSize: 18, bold: true, color: '0f172a' });
        let pptTableRows = [["Product Model", "Captured Technical Quality Issue Description", "Logged", "Reference Ticket", "Resolution Status"]];
        incidentLogDataset.forEach(inc => { pptTableRows.push([inc.model, inc.issue, inc.date, inc.ref, inc.status]); });
        slide2.addTable(pptTableRows, { x: 0.5, y: 1.5, w: 12.3, colW: [1.8, 5.3, 1.0, 2.5, 1.7], border: { pt: '1', color: 'e2e2e2' }, fill: 'ffffff', fontSize: 9, autoPage: true });

        Object.keys(activeStateDataset).forEach(id => {
            const p = activeStateDataset[id];
            let slide = pptx.addSlide();
            slide.addText(`${p.title.toUpperCase()} FUNCTIONAL CHECKLIST STATUS`, { x: 0.5, y: 0.4, w: 11, h: 0.5, fontSize: 18, bold: true, color: '0f172a' });
            slide.addText("Egypt Proactive Quality Evaluation Framework", { x: 0.5, y: 0.9, w: 8, h: 0.3, fontSize: 11, bold: true, color: 'e11d48' });

            let currentY = 1.4;
            ['key', 'app', 'prev'].forEach(sec => {
                let titleLabel = sec === 'key' ? "Key Functions" : sec === 'app' ? "Common Apps" : "Previous Series Bugs Trace";
                let itemsList = [];
                if (p[sec]) p[sec].forEach(item => { itemsList.push((item.checked ? "[✓] " : "[ ] ") + item.text); });

                if(itemsList.length > 0) {
                    slide.addText(titleLabel, { x: 0.5, y: currentY, w: 4, h: 0.3, fontSize: 12, bold: true, color: '1e293b' });
                    currentY += 0.35;
                    slide.addText(itemsList.slice(0, 5).join("\n"), { x: 0.5, y: currentY, w: 12.3, h: 1.1, fontSize: 10, color: '64748b', lineSpacing: 3 });
                    currentY += 1.3;
                }
            });
        });

        pptx.writeFile({ fileName: 'Operations_Strategic_Checklist_Review' });
    }

    function triggerNativeDownload(url, filename) { const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); }
</script>
